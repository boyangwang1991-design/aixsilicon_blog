<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="CPU 与 DMA 在总线侧权限判定后的允许和拒绝路径">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="70" y="74" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="70" dy="0">检查点必须覆盖所有可能写入安全区的 master</tspan></text><rect x="70" y="135" width="290" height="160" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="92" y="181" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="92" dy="0">CPU A</tspan></text><text x="92" y="223" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="92" dy="0">对参数区：允许写</tspan><tspan x="92" dy="34">示例权限</tspan></text><rect x="70" y="345" width="290" height="160" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="92" y="391" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="92" dy="0">DMA B</tspan></text><text x="92" y="433" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="92" dy="0">仅允许访问缓冲区</tspan><tspan x="92" dy="34">向参数区写：非法</tspan></text><rect x="485" y="190" width="425" height="280" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="507" y="236" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="507" dy="0">总线侧权限判定</tspan></text><text x="507" y="278" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="507" dy="0">输入：master ID</tspan><tspan x="507" dy="34">输入：地址 / 读写属性</tspan><tspan x="507" dy="34">输入：当前规则与模式</tspan><tspan x="507" dy="34">目标写使能在判定后发出</tspan></text><polyline points="360,215 475,278" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="360,425 475,355" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><rect x="1065" y="135" width="455" height="205" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1087" y="181" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="1087" dy="0">允许路径 → 参数 SRAM</tspan></text><text x="1087" y="223" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1087" dy="0">CPU A 合法写：数据和 ECC 更新</tspan><tspan x="1087" dy="34">返回正常完成响应</tspan></text><rect x="1065" y="410" width="455" height="205" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="1087" y="456" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="1087" dy="0">拒绝路径 → 不触碰目标</tspan></text><text x="1087" y="498" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1087" dy="0">DMA B 写：返回错误 + 上报</tspan><tspan x="1087" dy="34">目标数据和 ECC 位保持不变</tspan></text><polyline points="910,275 1055,240" fill="none" stroke="#087f83" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><polyline points="910,390 1055,505" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><line x1="65" y1="682" x2="1535" y2="682" stroke="#6a7b8b" stroke-width="3"/><rect x="70" y="740" width="640" height="54" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="390" y="776" fill="#6a7b8b" font-size="23" font-weight="700" text-anchor="middle"><tspan x="390" dy="0">CPU 本地 MPU 未必看得到 DMA 请求</tspan></text><rect x="870" y="740" width="640" height="54" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="1190" y="776" fill="#6a7b8b" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1190" dy="0">master ID 的生成与传递也要可信</tspan></text></g></svg>