<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="E2E 六类故障与内容身份顺序时间检查的对应及接收动作">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="70" y="75" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="70" dy="0">故障注入</tspan></text><text x="555" y="75" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="555" dy="0">优先观察</tspan></text><text x="1005" y="75" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="1005" dy="0">接收端应决定</tspan></text><rect x="55" y="112" width="1490" height="102" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="75" y="171" fill="#17375e" font-size="25" font-weight="700" text-anchor="start"><tspan x="75" dy="0">payload 位翻转</tspan></text><text x="555" y="171" fill="#087f83" font-size="25" font-weight="400" text-anchor="start"><tspan x="555" dy="0">CRC / 内容检查</tspan></text><text x="1005" y="171" fill="#17375e" font-size="24" font-weight="400" text-anchor="start"><tspan x="1005" dy="0">拒绝损坏帧</tspan></text><rect x="55" y="231" width="1490" height="102" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="75" y="290" fill="#17375e" font-size="25" font-weight="700" text-anchor="start"><tspan x="75" dy="0">别的通道完整帧</tspan></text><text x="555" y="290" fill="#087f83" font-size="25" font-weight="400" text-anchor="start"><tspan x="555" dy="0">本通道 Data ID 绑定</tspan></text><text x="1005" y="290" fill="#17375e" font-size="24" font-weight="400" text-anchor="start"><tspan x="1005" dy="0">拒绝误路由帧</tspan></text><rect x="55" y="350" width="1490" height="102" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="75" y="409" fill="#17375e" font-size="25" font-weight="700" text-anchor="start"><tspan x="75" dy="0">同一帧重复</tspan></text><text x="555" y="409" fill="#087f83" font-size="25" font-weight="400" text-anchor="start"><tspan x="555" dy="0">counter 与接收状态</tspan></text><text x="1005" y="409" fill="#17375e" font-size="24" font-weight="400" text-anchor="start"><tspan x="1005" dy="0">拒绝重复或按策略处理</tspan></text><rect x="55" y="469" width="1490" height="102" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="75" y="528" fill="#17375e" font-size="25" font-weight="700" text-anchor="start"><tspan x="75" dy="0">跳号 / 乱序</tspan></text><text x="555" y="528" fill="#087f83" font-size="25" font-weight="400" text-anchor="start"><tspan x="555" dy="0">counter 允许窗口</tspan></text><text x="1005" y="528" fill="#17375e" font-size="24" font-weight="400" text-anchor="start"><tspan x="1005" dy="0">拒绝或标记丢帧</tspan></text><rect x="55" y="588" width="1490" height="102" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="75" y="647" fill="#17375e" font-size="25" font-weight="700" text-anchor="start"><tspan x="75" dy="0">迟到 / 完全丢失</tspan></text><text x="555" y="647" fill="#087f83" font-size="25" font-weight="400" text-anchor="start"><tspan x="555" dy="0">接收超时计时</tspan></text><text x="1005" y="647" fill="#17375e" font-size="24" font-weight="400" text-anchor="start"><tspan x="1005" dy="0">旧值何时必须失效</tspan></text><rect x="55" y="707" width="1490" height="102" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="75" y="766" fill="#bd7510" font-size="25" font-weight="700" text-anchor="start"><tspan x="75" dy="0">生成前错 / 检查后改</tspan></text><text x="555" y="766" fill="#6a7b8b" font-size="25" font-weight="400" text-anchor="start"><tspan x="555" dy="0">图示 E2E 边界外</tspan></text><text x="1005" y="766" fill="#17375e" font-size="24" font-weight="400" text-anchor="start"><tspan x="1005" dy="0">另设源端/使用端检查</tspan></text><text x="70" y="858" fill="#6a7b8b" font-size="22" font-weight="400" text-anchor="start"><tspan x="70" dy="0">是否能检出取决于 Profile、字段布局、计数回绕、丢帧窗口及时间要求；普通 CRC 不用于身份认证。</tspan></text></g></svg>