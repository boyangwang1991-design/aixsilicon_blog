<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="IP 安全手册把能力边界和使用假设交给 SoC 集成验证"><defs><marker id="a-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="a-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="a-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="a-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#667a8b"/></marker></defs><rect width="1600" height="900" fill="#fcfdfd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="65" y="68" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">IP 的 UE 告警怎样变成系统承诺</tspan></text><rect x="55" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="76" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="76" dy="0">供应方能力</tspan></text><text x="76" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="76" dy="0">支持配置 / 码字</tspan><tspan x="76" dy="31.5">UE、valid、锁存语义</tspan></text><polyline points="331.4,240 351.4,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="358.4" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="379.4" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="379.4" dy="0">Safety Manual</tspan></text><text x="379.4" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="379.4" dy="0">AoU / 残余故障</tspan><tspan x="379.4" dy="31.5">测试与时限</tspan></text><polyline points="634.8,240 654.8,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="661.8" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="682.8" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="682.8" dy="0">SoC 连接</tspan></text><text x="682.8" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="682.8" dy="0">Error Manager / HSI</tspan><tspan x="682.8" dy="31.5">时钟复位与初始化</tspan></text><polyline points="938.1999999999999,240 958.1999999999999,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="965.1999999999999" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="986.1999999999999" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="986.1999999999999" dy="0">集成验证</tspan></text><text x="986.1999999999999" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="986.1999999999999" dy="0">故障注入 / 时间</tspan><tspan x="986.1999999999999" dy="31.5">核对每项 AoU</tspan></text><polyline points="1241.6,240 1261.6,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="1268.6" y="130" width="276.4" height="220" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1289.6" y="175" fill="#087f83" font-size="27" font-weight="700" text-anchor="start"><tspan x="1289.6" dy="0">系统结论</tspan></text><text x="1289.6" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="1289.6" dy="0">受控动作已完成</tspan><tspan x="1289.6" dy="31.5">限定配置与情境</tspan></text><line x1="55" y1="405" x2="1545" y2="405" stroke="#667a8b" stroke-width="3"/><text x="65" y="460" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">另一份交接：DIA</tspan></text><rect x="65" y="505" width="470" height="220" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="86" y="550" fill="#bd7510" font-size="27" font-weight="700" text-anchor="start"><tspan x="86" dy="0">组织职责</tspan></text><text x="86" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="86" dy="0">谁定义要求、谁分析</tspan><tspan x="86" dy="33">谁处理异常</tspan></text><rect x="570" y="505" width="470" height="220" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="591" y="550" fill="#bd7510" font-size="27" font-weight="700" text-anchor="start"><tspan x="591" dy="0">版本对应</tspan></text><text x="591" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="591" dy="0">RTL、宏、FMEDA、报告</tspan><tspan x="591" dy="33">手册使用同一基线</tspan></text><rect x="1075" y="505" width="470" height="220" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1096" y="550" fill="#087f83" font-size="27" font-weight="700" text-anchor="start"><tspan x="1096" dy="0">未满足 AoU</tspan></text><text x="1096" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1096" dy="0">补机制、改架构或收窄主张</tspan><tspan x="1096" dy="33">不可仅写“符合手册”</tspan></text></g></svg>