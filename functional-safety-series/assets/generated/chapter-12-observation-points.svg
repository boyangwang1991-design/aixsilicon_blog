<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="AXI Master 互连 Slave 两侧监控点及地址数据故障位置">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="70" y="72" fill="#17375e" font-size="29" font-weight="700" text-anchor="start"><tspan x="70" dy="0">同一笔读事务的观察边界</tspan></text><rect x="60" y="135" width="230" height="170" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="82" y="181" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="82" dy="0">Master</tspan></text><text x="82" y="223" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="82" dy="0">原意：读地址 A</tspan><tspan x="82" dy="34">记录请求 ID</tspan></text><rect x="360" y="135" width="230" height="170" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="382" y="181" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="382" dy="0">监控点 A</tspan></text><text x="382" y="223" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="382" dy="0">源端请求/响应</tspan><tspan x="382" dy="34">看不到内部位置</tspan></text><rect x="660" y="135" width="230" height="170" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="682" y="181" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="682" dy="0">Interconnect</tspan></text><text x="682" y="223" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="682" dy="0">地址/路由/返回</tspan><tspan x="682" dy="34">可能发生 A→B</tspan></text><rect x="960" y="135" width="230" height="170" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="982" y="181" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="982" dy="0">监控点 B</tspan></text><text x="982" y="223" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="982" dy="0">目标端实际到达</tspan><tspan x="982" dy="34">未必知道源端原意</tspan></text><rect x="1260" y="135" width="280" height="170" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="1282" y="181" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="1282" dy="0">Slave</tspan></text><text x="1282" y="223" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1282" dy="0">实际收到地址 B</tspan><tspan x="1282" dy="34">可能合法返回 B 数据</tspan></text><polyline points="290,218 350,218" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="590,218 650,218" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="890,218 950,218" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="1190,218 1250,218" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="75" y="395" width="430" height="205" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="97" y="441" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="97" dy="0">协议检查</tspan></text><text x="97" y="483" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="97" dy="0">握手、响应、顺序是否合法</tspan><tspan x="97" dy="34">合法事务仍可能送错地址</tspan></text><rect x="585" y="395" width="430" height="205" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="607" y="441" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="607" dy="0">内容检查</tspan></text><text x="607" y="483" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="607" dy="0">保护码生成→检查之间</tspan><tspan x="607" dy="34">每跳重算会掩盖上游损坏</tspan></text><rect x="1095" y="395" width="430" height="205" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="1117" y="441" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="1117" dy="0">身份与进度</tspan></text><text x="1117" y="483" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1117" dy="0">源端 A 对照目标端 B</tspan><tspan x="1117" dy="34">无响应需定义超时起点</tspan></text><rect x="90" y="695" width="430" height="54" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="305" y="731" fill="#bd7510" font-size="23" font-weight="700" text-anchor="middle"><tspan x="305" dy="0">故障点①：监控 A 之前改地址</tspan></text><rect x="585" y="695" width="430" height="54" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="800" y="731" fill="#bd7510" font-size="23" font-weight="700" text-anchor="middle"><tspan x="800" dy="0">故障点②：互连内 A→B</tspan></text><rect x="1080" y="695" width="430" height="54" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="1295" y="731" fill="#bd7510" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1295" dy="0">故障点③：返回数据位翻转</tspan></text><text x="80" y="825" fill="#6a7b8b" font-size="24" font-weight="400" text-anchor="start"><tspan x="80" dy="0">监控点只证明它看得到的接口行为；身份关联与 parity/timeout 均需按设计增设。</tspan></text></g></svg>