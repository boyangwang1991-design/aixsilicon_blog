<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="故障注入从位置选择到激活检测报告动作的完整观察链"><defs><marker id="a-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="a-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="a-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="a-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#667a8b"/></marker></defs><rect width="1600" height="900" fill="#fcfdfd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="65" y="68" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">一次注入应留下哪些证据</tspan></text><rect x="55" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="76" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="76" dy="0">Inject</tspan></text><text x="76" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="76" dy="0">模型 / 位置 / 时刻</tspan><tspan x="76" dy="31.5">记录配置与版本</tspan></text><polyline points="331.4,240 351.4,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="358.4" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="379.4" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="379.4" dy="0">Propagate</tspan></text><text x="379.4" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="379.4" dy="0">故障确已激活</tspan><tspan x="379.4" dy="31.5">相关事务到达</tspan></text><polyline points="634.8,240 654.8,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="661.8" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="682.8" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="682.8" dy="0">Detect</tspan></text><text x="682.8" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="682.8" dy="0">机制发现错误</tspan><tspan x="682.8" dy="31.5">记录检测时刻</tspan></text><polyline points="938.1999999999999,240 958.1999999999999,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="965.1999999999999" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="986.1999999999999" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="986.1999999999999" dy="0">Report</tspan></text><text x="986.1999999999999" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="986.1999999999999" dy="0">事件锁存与送达</tspan><tspan x="986.1999999999999" dy="31.5">记录错误身份</tspan></text><polyline points="1241.6,240 1261.6,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="1268.6" y="130" width="276.4" height="220" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1289.6" y="175" fill="#087f83" font-size="27" font-weight="700" text-anchor="start"><tspan x="1289.6" dy="0">React + Check</tspan></text><text x="1289.6" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="1289.6" dy="0">数据门控 / 受控动作</tspan><tspan x="1289.6" dy="31.5">独立判据核对</tspan></text><line x1="55" y1="405" x2="1545" y2="405" stroke="#667a8b" stroke-width="3"/><text x="65" y="460" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">结果不能只分 PASS / FAIL</tspan></text><rect x="65" y="505" width="470" height="220" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="86" y="550" fill="#bd7510" font-size="27" font-weight="700" text-anchor="start"><tspan x="86" dy="0">未激活</tspan></text><text x="86" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="86" dy="0">未访问故障地址</tspan><tspan x="86" dy="33">不得算作已检出</tspan></text><rect x="570" y="505" width="470" height="220" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="591" y="550" fill="#bd7510" font-size="27" font-weight="700" text-anchor="start"><tspan x="591" dy="0">检出但未响应</tspan></text><text x="591" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="591" dy="0">error 拉高</tspan><tspan x="591" dy="33">坏数据或危险输出仍可能逃逸</tspan></text><rect x="1075" y="505" width="470" height="220" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1096" y="550" fill="#087f83" font-size="27" font-weight="700" text-anchor="start"><tspan x="1096" dy="0">检出并响应 / 逃逸</tspan></text><text x="1096" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1096" dy="0">按需求与时间分类</tspan><tspan x="1096" dy="33">同时保留失败样本</tspan></text></g></svg>