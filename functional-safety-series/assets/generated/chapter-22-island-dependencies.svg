<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="主 SoC 安全岛 共享资源 共因风险和最终隔离路径"><defs><marker id="a-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="a-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="a-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="a-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#667a8b"/></marker></defs><rect width="1600" height="900" fill="#fcfdfd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="65" y="70" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">安全岛的独立性要沿资源和动作路径逐项核对</tspan></text><rect x="70" y="185" width="430" height="225" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="91" y="230" fill="#17375e" font-size="29" font-weight="700" text-anchor="start"><tspan x="91" dy="0">主 SoC</tspan></text><text x="91" y="270" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="91" dy="0">CPU / SRAM / 互连</tspan><tspan x="91" dy="33">安全相关功能</tspan></text><rect x="600" y="185" width="430" height="225" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="621" y="230" fill="#087f83" font-size="29" font-weight="700" text-anchor="start"><tspan x="621" dy="0">Safety Island</tspan></text><text x="621" y="270" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="621" dy="0">事件锁存 / 监控任务</tspan><tspan x="621" dy="33">分类与升级</tspan></text><rect x="1130" y="185" width="390" height="225" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1151" y="230" fill="#087f83" font-size="29" font-weight="700" text-anchor="start"><tspan x="1151" dy="0">最终输出</tspan></text><text x="1151" y="270" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1151" dy="0">硬件隔离 / 复位</tspan><tspan x="1151" dy="33">执行结果必须可见</tspan></text><polyline points="500,280 590,280" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#a-navy)"/><polyline points="1030,280 1120,280" fill="none" stroke="#087f83" stroke-width="5" stroke-linejoin="round" marker-end="url(#a-teal)"/><rect x="70" y="520" width="430" height="170" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="91" y="565" fill="#bd7510" font-size="29" font-weight="700" text-anchor="start"><tspan x="91" dy="0">共享资源候选</tspan></text><text x="91" y="605" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="91" dy="0">PLL / 复位树 / 电源</tspan><tspan x="91" dy="33">调试网络 / 主互连</tspan></text><polyline points="290,520 290,420" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#a-amber)"/><polyline points="500,610 815,610 815,420" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#a-amber)"/><rect x="600" y="520" width="430" height="170" rx="17" fill="#fff0ef" stroke="#c73535" stroke-width="3"/><text x="621" y="565" fill="#c73535" font-size="29" font-weight="700" text-anchor="start"><tspan x="621" dy="0">共因路径</tspan></text><text x="621" y="605" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="621" dy="0">同源故障可使两域停摆</tspan><tspan x="621" dy="33">不能当作两次独立故障</tspan></text><rect x="1130" y="520" width="390" height="170" rx="17" fill="#f2f5f7" stroke="#667a8b" stroke-width="3" stroke-dasharray="10 7"/><text x="1151" y="565" fill="#667a8b" font-size="29" font-weight="700" text-anchor="start"><tspan x="1151" dy="0">待验证缓解</tspan></text><text x="1151" y="605" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1151" dy="0">独立时基与直达线</tspan><tspan x="1151" dy="33">供电和生效时限仍要核对</tspan></text><rect x="170" y="770" width="1260" height="58" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="800" y="808" fill="#bd7510" font-size="23" font-weight="700" text-anchor="middle"><tspan x="800" dy="0">岛内“已检测”只有连到仍可工作的最终动作，才支持响应主张</tspan></text></g></svg>