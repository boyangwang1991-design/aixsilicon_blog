<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="故障激活到受控动作的分段最坏时间与 FTTI 比较"><defs><marker id="a-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="a-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="a-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="a-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#667a8b"/></marker></defs><rect width="1600" height="900" fill="#fcfdfd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="65" y="68" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">一个 ECC 周期不等于系统反应时间</tspan></text><rect x="55" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="76" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="76" dy="0">故障激活</tspan></text><text x="76" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="76" dy="0">可能等待相关读取</tspan><tspan x="76" dy="31.5">无最大间隔则无界</tspan></text><polyline points="331.4,240 351.4,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="358.4" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="379.4" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="379.4" dy="0">ECC 检测</tspan></text><text x="379.4" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="379.4" dy="0">同笔数据无效</tspan><tspan x="379.4" dy="31.5">记录检测时刻</tspan></text><polyline points="634.8,240 654.8,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="661.8" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="682.8" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="682.8" dy="0">事件传递</tspan></text><text x="682.8" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="682.8" dy="0">锁存、路由、IRQ</tspan><tspan x="682.8" dy="31.5">检查屏蔽与拥塞</tspan></text><polyline points="938.1999999999999,240 958.1999999999999,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="965.1999999999999" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="986.1999999999999" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="986.1999999999999" dy="0">决策执行</tspan></text><text x="986.1999999999999" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="986.1999999999999" dy="0">软件或硬件动作</tspan><tspan x="986.1999999999999" dy="31.5">观察输出完成</tspan></text><polyline points="1241.6,240 1261.6,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="1268.6" y="130" width="276.4" height="220" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1289.6" y="175" fill="#087f83" font-size="27" font-weight="700" text-anchor="start"><tspan x="1289.6" dy="0">比较 FTTI</tspan></text><text x="1289.6" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="1289.6" dy="0">合计最坏时间 + 裕量</tspan><tspan x="1289.6" dy="31.5">须早于危险输出</tspan></text><line x1="55" y1="405" x2="1545" y2="405" stroke="#667a8b" stroke-width="3"/><text x="65" y="460" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">三种不能偷掉的时间</tspan></text><rect x="65" y="505" width="470" height="220" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="86" y="550" fill="#bd7510" font-size="27" font-weight="700" text-anchor="start"><tspan x="86" dy="0">潜伏等待</tspan></text><text x="86" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="86" dy="0">长期不读时需巡检</tspan><tspan x="86" dy="33">另定检测间隔</tspan></text><rect x="570" y="505" width="470" height="220" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="591" y="550" fill="#bd7510" font-size="27" font-weight="700" text-anchor="start"><tspan x="591" dy="0">共享失效</tspan></text><text x="591" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="591" dy="0">CPU / 时钟也会坏</tspan><tspan x="591" dy="33">备用路径重算</tspan></text><rect x="1075" y="505" width="470" height="220" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1096" y="550" fill="#087f83" font-size="27" font-weight="700" text-anchor="start"><tspan x="1096" dy="0">条件变化</tspan></text><text x="1096" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1096" dy="0">启动 / 正常 / 降级</tspan><tspan x="1096" dy="33">按状态分别预算</tspan></text></g></svg>