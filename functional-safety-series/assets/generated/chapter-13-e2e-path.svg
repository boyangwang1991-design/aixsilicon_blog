<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="E2E 从生产者到消费者的保护边界 四项检查及两类边界外故障">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="65" y="68" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="65" dy="0">保护范围：生产者生成 → 最终消费者检查</tspan></text><rect x="60" y="140" width="310" height="205" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="82" y="186" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="82" dy="0">生产者</tspan></text><text x="82" y="228" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="82" dy="0">生成 payload / counter</tspan><tspan x="82" dy="34">Data ID 参与逻辑绑定</tspan><tspan x="82" dy="34">按约定字段计算 CRC</tspan></text><rect x="450" y="140" width="265" height="205" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="472" y="186" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="472" dy="0">DMA / 队列</tspan></text><text x="472" y="228" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="472" dy="0">帧复制、缓存</tspan><tspan x="472" dy="34">可发生重复/丢失</tspan></text><rect x="795" y="140" width="265" height="205" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="817" y="186" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="817" dy="0">互连 / 存储</tspan></text><text x="817" y="228" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="817" dy="0">地址或内容可受扰动</tspan><tspan x="817" dy="34">不应悄悄重算 CRC</tspan></text><rect x="1140" y="140" width="390" height="205" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1162" y="186" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="1162" dy="0">最终消费者</tspan></text><text x="1162" y="228" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1162" dy="0">检查 CRC / Data ID / counter</tspan><tspan x="1162" dy="34">另看接收超时</tspan><tspan x="1162" dy="34">通过后才采纳或拒绝</tspan></text><polyline points="370,237 440,237" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="715,237 785,237" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="1060,237 1130,237" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><line x1="65" y1="410" x2="1535" y2="410" stroke="#6a7b8b" stroke-width="3"/><text x="75" y="465" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="75" dy="0">接收端四项判断</tspan></text><rect x="65" y="510" width="350" height="130" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="87" y="556" fill="#087f83" font-size="29" font-weight="700" text-anchor="start"><tspan x="87" dy="0">CRC</tspan></text><text x="87" y="598" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="87" dy="0">内容损坏</tspan></text><rect x="450" y="510" width="350" height="130" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="472" y="556" fill="#087f83" font-size="29" font-weight="700" text-anchor="start"><tspan x="472" dy="0">Data ID</tspan></text><text x="472" y="598" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="472" dy="0">错类型 / 误路由</tspan></text><rect x="835" y="510" width="350" height="130" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="857" y="556" fill="#087f83" font-size="29" font-weight="700" text-anchor="start"><tspan x="857" dy="0">counter</tspan></text><text x="857" y="598" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="857" dy="0">重复 / 跳号 / 乱序</tspan></text><rect x="1220" y="510" width="350" height="130" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="1242" y="556" fill="#bd7510" font-size="29" font-weight="700" text-anchor="start"><tspan x="1242" dy="0">超时</tspan></text><text x="1242" y="598" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1242" dy="0">无新帧 / 迟到</tspan></text><rect x="75" y="710" width="660" height="126" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="97" y="756" fill="#6a7b8b" font-size="30" font-weight="700" text-anchor="start"><tspan x="97" dy="0">边界外①：生成 CRC 前数值已错</tspan></text><text x="97" y="798" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="97" dy="0">后续保护字段可能忠实保护错误数值</tspan></text><rect x="850" y="710" width="660" height="126" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="872" y="756" fill="#6a7b8b" font-size="30" font-weight="700" text-anchor="start"><tspan x="872" dy="0">边界外②：检查通过后再次被改</tspan></text><text x="872" y="798" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="872" dy="0">使用点已不在图示 E2E 检查范围内</tspan></text></g></svg>