<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="访问控制策略切换中权限过宽或全拒绝的风险及候选控制">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="70" y="74" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="70" dy="0">旧规则 → 切换窗口 → 新规则</tspan></text><rect x="65" y="145" width="385" height="165" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="87" y="191" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="87" dy="0">旧规则</tspan></text><text x="87" y="233" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="87" dy="0">CPU A 可写参数区</tspan><tspan x="87" dy="34">DMA B 不可写</tspan></text><rect x="605" y="145" width="385" height="165" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="627" y="191" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="627" dy="0">更新中的事务</tspan></text><text x="627" y="233" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="627" dy="0">在途请求如何判定？</tspan><tspan x="627" dy="34">规则何时生效？</tspan></text><rect x="1145" y="145" width="385" height="165" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="1167" y="191" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="1167" dy="0">新规则</tspan></text><text x="1167" y="233" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1167" dy="0">权限按新配置执行</tspan><tspan x="1167" dy="34">须确认切换完成</tspan></text><polyline points="450,228 595,228" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="990,228 1135,228" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="75" y="405" width="655" height="175" rx="18" fill="#fff0ef" stroke="#c73535" stroke-width="3"/><text x="97" y="451" fill="#c73535" font-size="30" font-weight="700" text-anchor="start"><tspan x="97" dy="0">失效方向①：权限过宽</tspan></text><text x="97" y="493" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="97" dy="0">先开放新规则再撤旧规则</tspan><tspan x="97" dy="34">短时间内两个 master 都可能可写</tspan></text><rect x="870" y="405" width="655" height="175" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="892" y="451" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="892" dy="0">失效方向②：全拒绝</tspan></text><text x="892" y="493" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="892" dy="0">先撤旧规则再装新规则</tspan><tspan x="892" dy="34">合法安全任务可能超时</tspan></text><rect x="75" y="665" width="655" height="145" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="97" y="711" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="97" dy="0">候选控制：原子切换</tspan></text><text x="97" y="753" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="97" dy="0">双缓冲规则；在途事务语义仍要定义</tspan></text><rect x="870" y="665" width="655" height="145" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="892" y="711" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="892" dy="0">候选控制：更新期间阻断</tspan></text><text x="892" y="753" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="892" dy="0">暂停相关事务；核对可容忍时长</tspan></text></g></svg>