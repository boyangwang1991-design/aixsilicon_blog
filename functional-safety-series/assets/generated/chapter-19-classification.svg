<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="按指定安全目标和独立故障条件分类 SPF RF MPF 与安全故障"><defs><marker id="a-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="a-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="a-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="a-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#667a8b"/></marker></defs><rect width="1600" height="900" fill="#fcfdfd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="65" y="68" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">同一故障模式先问什么</tspan></text><rect x="55" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="76" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="76" dy="0">固定范围</tspan></text><text x="76" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="76" dy="0">指定 SG / 硬件元素</tspan><tspan x="76" dy="31.5">分配模式失效率</tspan></text><polyline points="331.4,240 351.4,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="358.4" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="379.4" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="379.4" dy="0">单独违反 SG？</tspan></text><text x="379.4" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="379.4" dy="0">无机制时先判断</tspan><tspan x="379.4" dy="31.5">再检查实际机制</tspan></text><polyline points="634.8,240 654.8,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="661.8" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="682.8" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="682.8" dy="0">机制有效份额</tspan></text><text x="682.8" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="682.8" dy="0">未控制→SPF / RF</tspan><tspan x="682.8" dy="31.5">受控份额继续分析</tspan></text><polyline points="938.1999999999999,240 958.1999999999999,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="965.1999999999999" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="986.1999999999999" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="986.1999999999999" dy="0">需独立故障？</tspan></text><text x="986.1999999999999" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="986.1999999999999" dy="0">多点路径进入 MPF</tspan><tspan x="986.1999999999999" dy="31.5">共因另做 DFA</tspan></text><polyline points="1241.6,240 1261.6,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="1268.6" y="130" width="276.4" height="220" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1289.6" y="175" fill="#087f83" font-size="27" font-weight="700" text-anchor="start"><tspan x="1289.6" dy="0">规定间隔？</tspan></text><text x="1289.6" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="1289.6" dy="0">及时检出→MPF,DP</tspan><tspan x="1289.6" dy="31.5">未检出→MPF,L</tspan></text><line x1="55" y1="405" x2="1545" y2="405" stroke="#667a8b" stroke-width="3"/><text x="65" y="460" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">分类边界</tspan></text><rect x="65" y="505" width="470" height="220" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="86" y="550" fill="#bd7510" font-size="27" font-weight="700" text-anchor="start"><tspan x="86" dy="0">SPF 与 RF</tspan></text><text x="86" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="86" dy="0">未保护 / 有机制仍逃逸</tspan><tspan x="86" dy="33">看模式而非 IP 名称</tspan></text><rect x="570" y="505" width="470" height="220" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="591" y="550" fill="#bd7510" font-size="27" font-weight="700" text-anchor="start"><tspan x="591" dy="0">MPF 已检出 / 潜伏</tspan></text><text x="591" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="591" dy="0">检测间隔决定归属</tspan><tspan x="591" dy="33">延迟超限不可算已检出</tspan></text><rect x="1075" y="505" width="470" height="220" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1096" y="550" fill="#087f83" font-size="27" font-weight="700" text-anchor="start"><tspan x="1096" dy="0">安全故障 λS</tspan></text><text x="1096" y="590" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1096" dy="0">相对于指定 SG</tspan><tspan x="1096" dy="33">换 SG 要重新分类</tspan></text></g></svg>