<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="LBIST 的 PRPG 扫描链 被测逻辑 MISR 签名比较和控制结果">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="70" y="70" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="70" dy="0">受测结构</tspan></text><rect x="60" y="115" width="235" height="188" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="82" y="161" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="82" dy="0">PRPG / LFSR</tspan></text><text x="82" y="203" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="82" dy="0">生成测试模式</tspan><tspan x="82" dy="34">模式数受配置约束</tspan></text><rect x="355" y="115" width="245" height="188" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="377" y="161" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="377" dy="0">扫描链</tspan></text><text x="377" y="203" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="377" dy="0">移入模式 · 捕获</tspan><tspan x="377" dy="34">测试域须明确定义</tspan></text><rect x="660" y="115" width="245" height="188" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="682" y="161" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="682" dy="0">被测逻辑</tspan></text><text x="682" y="203" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="682" dy="0">响应进入扫描链</tspan><tspan x="682" dy="34">未扫描路径不计入</tspan></text><rect x="965" y="115" width="245" height="188" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="987" y="161" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="987" dy="0">MISR</tspan></text><text x="987" y="203" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="987" dy="0">压缩多次响应</tspan><tspan x="987" dy="34">存在签名混叠边界</tspan></text><rect x="1270" y="115" width="265" height="188" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1292" y="161" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="1292" dy="0">签名比较</tspan></text><text x="1292" y="203" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1292" dy="0">实测 vs 期望</tspan><tspan x="1292" dy="34">版本/域/模式须匹配</tspan></text><polyline points="295,210 345,210" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="600,210 650,210" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="905,210 955,210" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><polyline points="1210,210 1260,210" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><line x1="60" y1="360" x2="1540" y2="360" stroke="#6a7b8b" stroke-width="3"/><text x="70" y="410" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="70" dy="0">控制与判定</tspan></text><rect x="65" y="450" width="415" height="230" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="87" y="496" fill="#6a7b8b" font-size="30" font-weight="700" text-anchor="start"><tspan x="87" dy="0">LBIST 控制器</tspan></text><text x="87" y="538" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="87" dy="0">选择域 / 扫描模式 / 时钟</tspan><tspan x="87" dy="34">启动、完成、超时分开记录</tspan><tspan x="87" dy="34">测试自身也需要故障分析</tspan></text><rect x="550" y="450" width="420" height="230" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="572" y="496" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="572" dy="0">完成 ≠ 通过</tspan></text><text x="572" y="538" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="572" dy="0">完成后再比较期望签名</tspan><tspan x="572" dy="34">签名不符或超时：锁存失败</tspan><tspan x="572" dy="34">结果须与本次配置对应</tspan></text><rect x="1040" y="450" width="490" height="230" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1062" y="496" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="1062" dy="0">交给系统的结果</tspan></text><text x="1062" y="538" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1062" dy="0">PASS：仍需退出测试与恢复</tspan><tspan x="1062" dy="34">FAIL / TIMEOUT：禁止直接放行</tspan><tspan x="1062" dy="34">事件送错误管理器</tspan></text><polyline points="480,565 540,565" fill="none" stroke="#6a7b8b" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><polyline points="970,565 1030,565" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><rect x="235" y="745" width="470" height="54" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="470" y="781" fill="#17375e" font-size="23" font-weight="700" text-anchor="middle"><tspan x="470" dy="0">目标：选定扫描域的结构故障</tspan></text><rect x="895" y="745" width="470" height="54" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="1130" y="781" fill="#6a7b8b" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1130" dy="0">边界：故障覆盖要靠模式与故障仿真</tspan></text></g></svg>