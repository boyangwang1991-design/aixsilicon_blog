<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="LBIST 从启动到放行的六个状态和三类失败分支">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="70" y="78" fill="#17375e" font-size="29" font-weight="700" text-anchor="start"><tspan x="70" dy="0">启动/受控测试窗口</tspan></text><rect x="55" y="135" width="225" height="168" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="77" y="181" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="77" dy="0">复位与隔离</tspan></text><text x="77" y="223" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="77" dy="0">输出保持受控</tspan></text><polyline points="280,215 305,215" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="313" y="135" width="225" height="168" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="335" y="181" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="335" dy="0">选择测试域</tspan></text><text x="335" y="223" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="335" dy="0">时钟/电源就绪</tspan></text><polyline points="538,215 563,215" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="571" y="135" width="225" height="168" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="593" y="181" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="593" dy="0">运行 LBIST</tspan></text><text x="593" y="223" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="593" dy="0">进入扫描模式</tspan></text><polyline points="796,215 821,215" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="829" y="135" width="225" height="168" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="851" y="181" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="851" dy="0">判定结果</tspan></text><text x="851" y="223" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="851" dy="0">完成且签名匹配</tspan></text><polyline points="1054,215 1079,215" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="1087" y="135" width="225" height="168" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="1109" y="181" fill="#17375e" font-size="28" font-weight="700" text-anchor="start"><tspan x="1109" dy="0">退出并恢复</tspan></text><text x="1109" y="223" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1109" dy="0">上下文/存储重建</tspan></text><polyline points="1312,215 1337,215" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="1345" y="135" width="225" height="168" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1367" y="181" fill="#087f83" font-size="28" font-weight="700" text-anchor="start"><tspan x="1367" dy="0">放行功能</tspan></text><text x="1367" y="223" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1367" dy="0">状态重新核对</tspan></text><line x1="55" y1="365" x2="1545" y2="365" stroke="#6a7b8b" stroke-width="3"/><text x="70" y="420" fill="#bd7510" font-size="29" font-weight="700" text-anchor="start"><tspan x="70" dy="0">失败与中断路径</tspan></text><rect x="80" y="455" width="420" height="168" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="102" y="501" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="102" dy="0">未运行 / 超时</tspan></text><text x="102" y="543" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="102" dy="0">不能当作测试通过</tspan><tspan x="102" dy="34">检查启动与时钟路径</tspan></text><rect x="590" y="455" width="420" height="168" rx="18" fill="#fff0ef" stroke="#c73535" stroke-width="3"/><text x="612" y="501" fill="#c73535" font-size="30" font-weight="700" text-anchor="start"><tspan x="612" dy="0">签名不符</tspan></text><text x="612" y="543" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="612" dy="0">锁存失败与目标域</tspan><tspan x="612" dy="34">不进入正常功能</tspan></text><rect x="1100" y="455" width="420" height="168" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="1122" y="501" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="1122" dy="0">恢复失败</tspan></text><text x="1122" y="543" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1122" dy="0">退出扫描模式未完成</tspan><tspan x="1122" dy="34">上下文或存储不可信</tspan></text><polyline points="280,623 280,702 750,702" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="800,623 800,691" fill="none" stroke="#c73535" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-red)"/><polyline points="1310,623 1310,702 850,702" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><rect x="565" y="702" width="470" height="132" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="587" y="748" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="587" dy="0">禁止放行 / 受控响应</tspan></text><text x="587" y="790" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="587" dy="0">按系统要求报告并保持安全输出</tspan></text></g></svg>