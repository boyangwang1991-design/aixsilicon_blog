<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Mini Safety SoC 的不可纠正数据阻断与错误响应双路径"><defs><marker id="a-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="a-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="a-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="a-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#667a8b"/></marker></defs><rect width="1600" height="900" fill="#fcfdfd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="65" y="70" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">一次 SRAM 不可纠正读：数据与错误走两条路径</tspan></text><rect x="70" y="160" width="300" height="190" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="91" y="205" fill="#17375e" font-size="29" font-weight="700" text-anchor="start"><tspan x="91" dy="0">CPU / AXI</tspan></text><text x="91" y="245" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="91" dy="0">发起参数读取</tspan><tspan x="91" dy="33">不得消费坏数据</tspan></text><rect x="480" y="160" width="330" height="190" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="501" y="205" fill="#bd7510" font-size="29" font-weight="700" text-anchor="start"><tspan x="501" dy="0">SRAM Controller</tspan></text><text x="501" y="245" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="501" dy="0">ECC 检出 UE</tspan><tspan x="501" dy="33">同笔 valid=0</tspan></text><rect x="920" y="160" width="290" height="190" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="941" y="205" fill="#17375e" font-size="29" font-weight="700" text-anchor="start"><tspan x="941" dy="0">Error Manager</tspan></text><text x="941" y="245" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="941" dy="0">事件锁存与分类</tspan><tspan x="941" dy="33">通知或升级</tspan></text><rect x="1290" y="160" width="260" height="190" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1311" y="205" fill="#087f83" font-size="29" font-weight="700" text-anchor="start"><tspan x="1311" dy="0">受控动作</tspan></text><text x="1311" y="245" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1311" dy="0">软件 / 硬件</tspan><tspan x="1311" dy="33">输出可观察</tspan></text><polyline points="370,255 470,255" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#a-navy)"/><text x="390" y="215" fill="#17375e" font-size="20" font-weight="700" text-anchor="start"><tspan x="390" dy="0">读请求</tspan></text><polyline points="610,350 610,390 220,390 220,360" fill="none" stroke="#bd7510" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-amber)"/><text x="335" y="382" fill="#bd7510" font-size="19" font-weight="700" text-anchor="start"><tspan x="335" dy="0">数据 / 响应</tspan></text><polyline points="810,255 910,255" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" marker-end="url(#a-amber)"/><text x="818" y="215" fill="#bd7510" font-size="20" font-weight="700" text-anchor="start"><tspan x="818" dy="0">错误事件</tspan></text><polyline points="1210,255 1280,255" fill="none" stroke="#087f83" stroke-width="5" stroke-linejoin="round" marker-end="url(#a-teal)"/><line x1="60" y1="430" x2="1540" y2="430" stroke="#667a8b" stroke-width="3"/><text x="65" y="490" fill="#bd7510" font-size="29" font-weight="700" text-anchor="start"><tspan x="65" dy="0">两条不能省略的核对路径</tspan></text><rect x="70" y="545" width="680" height="195" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="91" y="590" fill="#bd7510" font-size="29" font-weight="700" text-anchor="start"><tspan x="91" dy="0">数据路径</tspan></text><text x="91" y="630" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="91" dy="0">不可纠正结果不得正常返回</tspan><tspan x="91" dy="33">下游观察同一事务的 valid / 响应</tspan></text><rect x="850" y="545" width="680" height="195" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="871" y="590" fill="#087f83" font-size="29" font-weight="700" text-anchor="start"><tspan x="871" dy="0">错误与动作路径</tspan></text><text x="871" y="630" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="871" dy="0">事件身份、报告保持、送达</tspan><tspan x="871" dy="33">最终输出需赶在危险发生前</tspan></text><rect x="170" y="800" width="1260" height="58" rx="17" fill="#f2f5f7" stroke="#667a8b" stroke-width="3"/><text x="800" y="838" fill="#667a8b" font-size="23" font-weight="700" text-anchor="middle"><tspan x="800" dy="0">CPU 失效时的备用动作只是候选；必须按真实连接和故障注入验证</tspan></text></g></svg>