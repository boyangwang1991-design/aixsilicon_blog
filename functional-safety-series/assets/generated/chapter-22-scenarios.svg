="start"><tspan x="1168" dy="0">最终核对</tspan></text><rect x="60" y="194" width="320" height="108" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="75" y="234" fill="#17375e" font-size="20" font-weight="700" text-anchor="start"><tspan x="75" dy="0">主 CPU 卡住</tspan></text><rect x="390" y="194" width="370" height="108" rx="17" fill="#f2f5f7" stroke="#667a8b" stroke-width="3"/><text x="405" y="234" fill="#17375e" font-size="20" font-weight="400" text-anchor="start"><tspan x="405" dy="0">watchdog / heartbeat</tspan></text><rect x="770" y="194" width="370" height="108" rx="17" fill="#f2f5f7" stroke="#667a8b" stroke-width="3"/><text x="785" y="234" fill="#17375e" font-size="20" font-weight="400" text-anchor="start"><tspan x="785" dy="0">岛内时钟和错误路径</tspan></text><rect x="1150" y="194" width="390" height="108" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1165" y="234" fill="#17375e" font-size="20" font-weight="400" text-anchor="start"><tspan x="1165" dy="0">不靠主 CPU 完成动作</tspan></text><rect x="60" y="313" width="320" height="108" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="75" y="353" fill="#17375e" font-size="20" font-weight="700" text-anchor="start"><tspan x="75" dy="0">主时钟丢失</tspan></text><rect x="390" y="313" width="370" height="108" rx="17" fill="#f2f5f7" stroke="#667a8b" stroke-width="3"/><text x="405" y="353" fill="#17375e" font-size="20" font-weight="400" text-anchor="start"><tspan x="405" dy="0">独立参考监控</tspan></text><rect x="770" y="313" width="370" height="108" rx="17" fill="#f2f5f7" stroke="#667a8b" stroke-width="3"/><text x="785" y="353" fill="#17375e" font-size="20" font-weight="400" text-anchor="start"><tspan x="785" dy="0">岛内电源与时基</tspan></text><rect x="1150" y="313" width="390" height="108" rx="17" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1165" y="353" fill="#17375e" font-size="20" font-weight="400" text-anchor="start"><tspan x="1165" dy="0">直达隔离能否生效</tspan></text><rect x="60" y="43