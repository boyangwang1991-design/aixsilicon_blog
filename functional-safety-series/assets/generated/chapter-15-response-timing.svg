<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="ECC 检出到受控动作完成的正常与 IRQ 被屏蔽时序">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="75" y="75" fill="#17375e" font-size="29" font-weight="700" text-anchor="start"><tspan x="75" dy="0">正常 IRQ 路径</tspan></text><rect x="25" y="135" width="290" height="54" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="170" y="171" fill="#17375e" font-size="23" font-weight="700" text-anchor="middle"><tspan x="170" dy="0">t0 ECC 检出</tspan></text><polyline points="318,162 380,162" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="390" y="135" width="290" height="54" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="535" y="171" fill="#17375e" font-size="23" font-weight="700" text-anchor="middle"><tspan x="535" dy="0">t1 事件锁存</tspan></text><polyline points="683,162 745,162" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="755" y="135" width="290" height="54" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="900" y="171" fill="#17375e" font-size="23" font-weight="700" text-anchor="middle"><tspan x="900" dy="0">t2 进入处理</tspan></text><polyline points="1048,162 1110,162" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="1120" y="135" width="290" height="54" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1265" y="171" fill="#087f83" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1265" dy="0">t3 受控动作完成</tspan></text><rect x="100" y="260" width="670" height="135" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="122" y="306" fill="#6a7b8b" font-size="30" font-weight="700" text-anchor="start"><tspan x="122" dy="0">通知延迟：t2 − t0</tspan></text><text x="122" y="348" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="122" dy="0">仅说明 CPU 何时开始处理</tspan></text><rect x="830" y="260" width="670" height="135" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="852" y="306" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="852" dy="0">端到端反应：t3 − t0</tspan></text><text x="852" y="348" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="852" dy="0">包含软件与实际硬件动作</tspan></text><line x1="65" y1="455" x2="1535" y2="455" stroke="#6a7b8b" stroke-width="3"/><text x="75" y="515" fill="#bd7510" font-size="29" font-weight="700" text-anchor="start"><tspan x="75" dy="0">普通 IRQ 被屏蔽时</tspan></text><rect x="65" y="555" width="380" height="180" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="87" y="601" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="87" dy="0">事件仍在源端锁存</tspan></text><text x="87" y="643" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="87" dy="0">IRQ 不等于被 CPU 接收</tspan><tspan x="87" dy="34">错误详情不得被清掉</tspan></text><rect x="590" y="555" width="380" height="180" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3" stroke-dasharray="12 8"/><text x="612" y="601" fill="#6a7b8b" font-size="30" font-weight="700" text-anchor="start"><tspan x="612" dy="0">条件成立时才可升级</tspan></text><text x="612" y="643" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="612" dy="0">未处理超时 / NMI / 专用线</tspan><tspan x="612" dy="34">实际实现与共享依赖待核对</tspan></text><rect x="1115" y="555" width="380" height="180" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1137" y="601" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="1137" dy="0">受控动作仍要完成</tspan></text><text x="1137" y="643" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1137" dy="0">硬件隔离或可工作的处理器</tspan><tspan x="1137" dy="34">以输出状态为最终观察点</tspan></text><polyline points="445,645 580,645" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" stroke-dasharray="12 8" marker-end="url(#arrow-amber)"/><polyline points="970,645 1105,645" fill="none" stroke="#6a7b8b" stroke-width="5" stroke-linejoin="round" stroke-dasharray="12 8" marker-end="url(#arrow-gray)"/><text x="75" y="836" fill="#6a7b8b" font-size="23" font-weight="400" text-anchor="start"><tspan x="75" dy="0">若没有独立升级路径，应如实记录“响应依赖普通 IRQ 与 CPU 工作”的条件。</tspan></text></g></svg>