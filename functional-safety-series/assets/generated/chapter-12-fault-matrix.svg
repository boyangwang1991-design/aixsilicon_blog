<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="AXI 五种故障现象 对应观察点及候选检查机制">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="70" y="76" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="70" dy="0">故障现象</tspan></text><text x="575" y="76" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="575" dy="0">必要观察</tspan></text><text x="1070" y="76" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="1070" dy="0">候选检查与边界</tspan></text><rect x="55" y="115" width="1490" height="120" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="75" y="168" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="75" dy="0">握手/顺序违规</tspan></text><text x="575" y="168" fill="#17375e" font-size="25" font-weight="400" text-anchor="start"><tspan x="575" dy="0">所监控接口的通道行为</tspan></text><text x="1070" y="168" fill="#087f83" font-size="23" font-weight="400" text-anchor="start"><tspan x="1070" dy="0">协议 checker；只对可见接口有效</tspan></text><rect x="55" y="255" width="1490" height="120" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="75" y="308" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="75" dy="0">A 被送成 B</tspan></text><text x="575" y="308" fill="#17375e" font-size="25" font-weight="400" text-anchor="start"><tspan x="575" dy="0">源端意图 A + 目标端到达 B</tspan></text><text x="1070" y="308" fill="#087f83" font-size="23" font-weight="400" text-anchor="start"><tspan x="1070" dy="0">事务身份/地址关联；协议可仍合法</tspan></text><rect x="55" y="395" width="1490" height="120" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="75" y="448" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="75" dy="0">返回数据翻转</tspan></text><text x="575" y="448" fill="#17375e" font-size="25" font-weight="400" text-anchor="start"><tspan x="575" dy="0">保护码生成点到检查点</tspan></text><text x="1070" y="448" fill="#087f83" font-size="23" font-weight="400" text-anchor="start"><tspan x="1070" dy="0">parity/CRC；不覆盖生成前错误</tspan></text><rect x="55" y="535" width="1490" height="120" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3"/><text x="75" y="588" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="75" dy="0">请求无响应</tspan></text><text x="575" y="588" fill="#17375e" font-size="25" font-weight="400" text-anchor="start"><tspan x="575" dy="0">接受时刻 + 合法等待上限</tspan></text><text x="1070" y="588" fill="#087f83" font-size="23" font-weight="400" text-anchor="start"><tspan x="1070" dy="0">timeout；要避免正常背压误报</tspan></text><rect x="55" y="675" width="1490" height="120" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="75" y="728" fill="#bd7510" font-size="27" font-weight="700" text-anchor="start"><tspan x="75" dy="0">无请求却发生写入</tspan></text><text x="575" y="728" fill="#17375e" font-size="25" font-weight="400" text-anchor="start"><tspan x="575" dy="0">目标访问 + 源端请求日志</tspan></text><text x="1070" y="728" fill="#bd7510" font-size="23" font-weight="400" text-anchor="start"><tspan x="1070" dy="0">目标侧关联；只看 master 会漏</tspan></text><text x="70" y="855" fill="#6a7b8b" font-size="23" font-weight="400" text-anchor="start"><tspan x="70" dy="0">观察点、事务关联和允许等待时间须来自目标互连与安全要求；表中机制并非 AXI 默认配置。</tspan></text></g></svg>