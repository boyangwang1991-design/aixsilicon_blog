<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="安全目标通过 TSC 分配给 SRAM 控制器 错误管理器 软件和硬件隔离"><defs><marker id="a-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="a-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="a-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="a-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#667a8b"/></marker></defs><rect width="1600" height="900" fill="#fcfdfd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="65" y="68" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">“SRAM 要加 ECC”还缺哪些分配</tspan></text><rect x="55" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="76" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="76" dy="0">item 或 SEooC</tspan></text><text x="76" y="215" fill="#17375e" font-size="21" font-weight="400" text-anchor="start"><tspan x="76" dy="0">SG / FSR 与使用假设</tspan><tspan x="76" dy="31.5">时间和数据用途</tspan></text><polyline points="331.4,240 351.4,240" fill="none" stroke="#17375e" stroke-width="4" stroke-linejoin="round" marker-end="url(#a-navy)"/><rect x="358.4" y="130" width="276.4" height="220" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="379.4" y="175" fill="#17375e" font-size="27" font-weight="700" text-anchor="start"><tspan x="379.4" dy="0">TSC / TSR</tspan></text><text x="379.4" y="215" fill="#17375e" font-size="21" font-