<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Safety VIP 的事务和故障并行进入 DUT 后独立检查与覆盖收集"><defs><marker id="a-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="a-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="a-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="a-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#667a8b"/></marker></defs><rect width="1600" height="900" fill="#fcfdfd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="65" y="70" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="65" dy="0">Safety VIP：并行激励、独立判据、分层观察</tspan></text><rect x="65" y="150" width="340" height="145" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="86" y="195" fill="#17375e" font-size="29" font-weight="700" text-anchor="start"><tspan x="86" dy="0">事务发生器</tspan></text><text x="86" y="235" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="86" dy="0">正常 / 边界访问</tspan></text><rect x="65" y="365" width="340" height="145" rx="17" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="86" y="410" fill="#bd7510" font-size="29" font-weight="700" text-anchor="start"><tspan x="86" dy="0">故障注入器</tspan></text><text x="86" y="450" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="86" dy="0">位置 / 时间 / 模型</tspan></text><rect x="550" y="245" width="410" height="175" rx="17" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="571" y=