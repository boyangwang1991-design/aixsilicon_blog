<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="SRAM ECC 错误的数据有效性控制和事件锁存中断软件动作双路径">
<defs><marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#17375e"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f83"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#bd7510"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c73535"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6a7b8b"/></marker></defs>
<rect width="1600" height="900" fill="#fcfdfd"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="65" y="130" width="290" height="210" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="87" y="176" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="87" dy="0">SRAM + ECC</tspan></text><text x="87" y="218" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="87" dy="0">不可纠正读错误</tspan><tspan x="87" dy="34">本次事务标记无效</tspan><tspan x="87" dy="34">短事件须被锁存</tspan></text><rect x="450" y="105" width="330" height="170" rx="18" fill="#fff0ef" stroke="#c73535" stroke-width="3"/><text x="472" y="151" fill="#c73535" font-size="30" font-weight="700" text-anchor="start"><tspan x="472" dy="0">数据路径</tspan></text><text x="472" y="193" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="472" dy="0">响应门控 / valid 语义</tspan><tspan x="472" dy="34">阻止坏数据正常提交</tspan></text><rect x="450" y="370" width="330" height="190" rx="18" fill="#fff3dd" stroke="#bd7510" stroke-width="3"/><text x="472" y="416" fill="#bd7510" font-size="30" font-weight="700" text-anchor="start"><tspan x="472" dy="0">错误源锁存</tspan></text><text x="472" y="458" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="472" dy="0">保存地址/类型/事务</tspan><tspan x="472" dy="34">新事件与清除竞态须定义</tspan></text><polyline points="355,205 440,190" fill="none" stroke="#c73535" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-red)"/><polyline points="355,265 440,445" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><rect x="870" y="370" width="300" height="190" rx="18" fill="#edf4f9" stroke="#17375e" stroke-width="3"/><text x="892" y="416" fill="#17375e" font-size="30" font-weight="700" text-anchor="start"><tspan x="892" dy="0">Error Manager</tspan></text><text x="892" y="458" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="892" dy="0">分类 / 掩码 / 升级</tspan><tspan x="892" dy="34">严重事件可能硬件直达</tspan></text><rect x="1260" y="370" width="275" height="190" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1282" y="416" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="1282" dy="0">IRQ / NMI</tspan></text><text x="1282" y="458" fill="#17375e" font-size="23" font-weight="400" text-anchor="start"><tspan x="1282" dy="0">到达 CPU</tspan><tspan x="1282" dy="34">可被延迟或失效</tspan></text><polyline points="780,465 860,465" fill="none" stroke="#bd7510" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="1170,465 1250,465" fill="none" stroke="#17375e" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-navy)"/><rect x="1020" y="655" width="515" height="135" rx="18" fill="#e5f7f4" stroke="#087f83" stroke-width="3"/><text x="1042" y="701" fill="#087f83" font-size="30" font-weight="700" text-anchor="start"><tspan x="1042" dy="0">软件读取 → 受控动作</tspan></text><text x="1042" y="743" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="1042" dy="0">先读详情再清除；动作完成还需观察</tspan></text><polyline points="1395,560 1395,645" fill="none" stroke="#087f83" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="70" y="655" width="810" height="135" rx="18" fill="#f2f5f7" stroke="#6a7b8b" stroke-width="3" stroke-dasharray="12 8"/><text x="92" y="701" fill="#6a7b8b" font-size="30" font-weight="700" text-anchor="start"><tspan x="92" dy="0">可选硬件直达动作</tspan></text><text x="92" y="743" fill="#17375e" font-size="22" font-weight="400" text-anchor="start"><tspan x="92" dy="0">若 CPU 停摆或普通 IRQ 被屏蔽，必须验证此路径确实存在且仍工作</tspan></text><polyline points="1020,560 1020,615 475,615 475,645" fill="none" stroke="#6a7b8b" stroke-width="5" stroke-linejoin="round" stroke-dasharray="12 8" marker-end="url(#arrow-gray)"/></g></svg>