<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d86"/></marker></defs><rect width="1000" height="990" fill="#fbf8f0"/><g font-family="Microsoft YaHei, sans-serif"><text x="50" y="72" font-size="38" fill="#122b46" text-anchor="start">一个输出，怎样算出来？</text><text x="50" y="117" font-size="24" fill="#52657a" text-anchor="start">2 个输入特征 × 3 列权重 → 3 个输出特征</text><rect x="50" y="155" width="900" height="200" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="90" y="200" font-size="25" fill="#122b46" text-anchor="start">输入 x</text><text x="90" y="270" font-size="38" fill="#087d86" text-anchor="start">[ 2   3 ]</text><text x="310" y="260" font-size="40" fill="#122b46" text-anchor="start">×</text><text x="460" y="195" font-size="24" fill="#122b46" text-anchor="start">权重 W：每列对应一个输出</text><rect x="437" y="210" width="96" height="120" rx="18" fill="#e0f0ed" stroke="none" stroke-width="2"/><text x="485" y="254" font-size="32" fill="#087d86" text-anchor="middle">1</text><text x="485" y="305" font-size="32" fill="#087d86" text-anchor="middle">5</text><rect x="582" y="210" width="96" height="120" rx="18" fill="#fcf0d8" stroke="none" stroke-width="2"/><text x="630" y="254" font-size="32" fill="#ac6819" text-anchor="middle">4</text><text x="630" y="305" font-size="32" fill="#ac6819" text-anchor="middle">6</text><rect x="727" y="210" width="96" height="120" rx="18" fill="#e8edf8" stroke="none" stroke-width="2"/><text x="775" y="254" font-size="32" fill="#516bb4" text-anchor="middle">2</text><text x="775" y="305" font-size="32" fill="#516bb4" text-anchor="middle">-1</text><rect x="50" y="390" width="900" height="90" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="85" y="446" font-size="27" fill="#087d86" text-anchor="start">输出 0</text><text x="270" y="447" font-size="34" fill="#087d86" text-anchor="start">2 × 1 + 3 × 5 = 17</text><rect x="50" y="500" width="900" height="90" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="85" y="556" font-size="27" fill="#ac6819" text-anchor="start">输出 1</text><text x="270" y="557" font-size="34" fill="#ac6819" text-anchor="start">2 × 4 + 3 × 6 = 26</text><rect x="50" y="610" width="900" height="90" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="85" y="666" font-size="27" fill="#516bb4" text-anchor="start">输出 2</text><text x="270" y="667" font-size="34" fill="#516bb4" text-anchor="start">2 × 2 + 3 × (−1) = 1</text><rect x="50" y="750" width="900" height="120" rx="18" fill="#e0f0ed" stroke="none" stroke-width="2"/><text x="500" y="800" font-size="36" fill="#087d86" text-anchor="middle">y = [ 17   26   1 ]</text><text x="500" y="843" font-size="27" fill="#122b46" text-anchor="middle">同一条输入，三组权重，三次加权求和</text><text x="50" y="927" font-size="23" fill="#52657a" text-anchor="start">构造数字的原理示意 · 非 Gemma 4 权重</text></g></svg>