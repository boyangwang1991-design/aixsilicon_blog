<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d86"/></marker></defs><rect width="1000" height="1040" fill="#fbf8f0"/><g font-family="Microsoft YaHei, sans-serif"><text x="50" y="72" font-size="38" fill="#122b46" text-anchor="start">共享权重，不混合位置</text><text x="50" y="117" font-size="24" fill="#52657a" text-anchor="start">每个位置独立变换特征；输出保留原来的位置</text><rect x="225" y="155" width="550" height="165" rx="18" fill="#fcf0d8" stroke="none" stroke-width="2"/><text x="500" y="196" font-size="28" fill="#ac6819" text-anchor="middle">同一张权重 W：[2,3]</text><text x="500" y="244" font-size="31" fill="#122b46" text-anchor="middle">[ 1     4      2 ]</text><text x="500" y="290" font-size="31" fill="#122b46" text-anchor="middle">[ 5     6    −1 ]</text><path d="M400,320 L400,440" fill="none" stroke="#087d86" stroke-width="3" marker-end="url(#arrow)"/><path d="M775,250 L975,250 L975,570 L500,570 L500,610" fill="none" stroke="#087d86" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="430" width="250" height="110" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="75" y="468" font-size="24" fill="#122b46" text-anchor="start">位置 0</text><text x="175" y="513" font-size="32" fill="#087d86" text-anchor="middle">[ 2   3 ]</text><path d="M305,488 L368,488" fill="none" stroke="#087d86" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="445" width="240" height="80" rx="18" fill="#e0f0ed" stroke="none" stroke-width="2"/><text x="500" y="497" font-size="34" fill="#087d86" text-anchor="middle">× W</text><path d="M628,488 L690,488" fill="none" stroke="#087d86" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="430" width="250" height="110" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="825" y="499" font-size="31" fill="#122b46" text-anchor="middle">[ 17   26   1 ]</text><rect x="50" y="600" width="250" height="110" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="75" y="638" font-size="24" fill="#122b46" text-anchor="start">位置 1</text><text x="175" y="683" font-size="32" fill="#087d86" text-anchor="middle">[ 1   0 ]</text><path d="M305,658 L368,658" fill="none" stroke="#087d86" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="615" width="240" height="80" rx="18" fill="#e0f0ed" stroke="none" stroke-width="2"/><text x="500" y="667" font-size="34" fill="#087d86" text-anchor="middle">× W</text><path d="M628,658 L690,658" fill="none" stroke="#087d86" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="600" width="250" height="110" rx="18" fill="#ffffff" stroke="none" stroke-width="2"/><text x="825" y="669" font-size="31" fill="#122b46" text-anchor="middle">[ 1    4    2 ]</text><rect x="50" y="770" width="900" height="174" rx="18" fill="#e8edf8" stroke="none" stroke-width="2"/><text x="500" y="819" font-size="28" fill="#122b46" text-anchor="middle">推广到 B 个请求，每个请求 S 个位置</text><text x="500" y="873" font-size="34" fill="#122b46" text-anchor="middle">[B,S,D] × [D,N] → [B,S,N]</text><text x="500" y="917" font-size="26" fill="#122b46" text-anchor="middle">B、S 保留；只把特征宽度 D 变成 N</text><text x="50" y="996" font-size="23" fill="#52657a" text-anchor="start">构造数字的原理示意 · 非跨位置 Attention 计算</text></g></svg>