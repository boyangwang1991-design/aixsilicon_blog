<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d86"/></marker></defs><rect width="1000" height="1120" fill="#fbf8f0"/><g font-family="Microsoft YaHei, sans-serif"><text x="50" y="72" font-size="38" fill="#122b46" text-anchor="start">查表之后，向量怎样参与计算？</text><text x="50" y="117" font-size="24" fill="#52657a" text-anchor="start">Embedding 给出起点；Decoder 内的投影重组特征</text><rect x="50" y="155" width="900" height="105" rx="18" fill="#e0f0ed" stroke="none" stroke-width="2"/><text x="500" y="197" font-size="29" fill="#122b46" text-anchor="middle">主 Embedding：按 token ID 查表并缩放</text><text x="500" y="239" font-size="26" fill="#087d86" text-anchor="middle">得到每个位置的起始表示</text><path d="M500,265 L500,312" fill="none" stroke="#087d86" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="325" width="900" height="635" rx="18" fill="#ffffff" stroke="#d7dfdf" stroke-width="2"/><text x="85" y="374" font-size="30" fill="#122b46" text-anchor="start">Decoder 内部：两类计算如何使用线性投影</text><rect x="85" y="410" width="830" height="230" rx="18" fill="#e8edf8" stroke="none" stroke-width="2"/><text x="115" y="454" font-size="29" fill="#122b46" text-anchor="start">Attention：准备匹配与传递信息的表示</text><text x="115" y="504" font-size="29" fill="#516bb4" text-anchor="start">当前状态 → Q / K / V 投影</text><text x="115" y="553" font-size="27" fill="#122b46" text-anchor="start">Q 与 K 匹配位置；按注意力权重汇聚 V</text><text x="115" y="601" font-size="25" fill="#52657a" text-anchor="start">投影逐位置执行；后续注意力计算跨位置</text><rect x="85" y="665" width="830" height="245" rx="18" fill="#fcf0d8" stroke="none" stroke-width="2"/><text x="115" y="711" font-size="29" fill="#122b46" text-anchor="start">MLP：加工当前位置的特征组合</text><text x="115" y="758" font-size="29" fill="#ac6819" text-anchor="start">两路 2560 → 10240 投影</text><text x="115" y="804" font-size="28" fill="#122b46" text-anchor="start">激活与逐元素相乘 → 10240 → 2560</text><text x="115" y="856" font-size="25" fill="#52657a" text-anchor="start">各位置独立计算；输出回到主路宽度</text><text x="50" y="1012" font-size="25" fill="#52657a" text-anchor="start">概念分工图：上下两框不表示并行执行。</text><text x="50" y="1050" font-size="23" fill="#52657a" text-anchor="start">Q/K/V 以自行计算 K/V 的层为例；共享层复用 K/V。</text><text x="50" y="1087" font-size="23" fill="#52657a" text-anchor="start">省略归一化、位置编码、残差及其他分支。</text></g></svg>