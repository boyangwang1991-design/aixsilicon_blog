<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">GQA：八个查询头怎样共用两组 K/V</title>
  <desc id="desc">E4B 第零层的八个 Q 头分成两组。Q0 到 Q3 共用 KV 头零，Q4 到 Q7 共用 KV 头一。每个 Q 头仍分别计算位置权重并得到自己的输出。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#547286"/></marker>
    <style>
      text { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; fill:#183446; }
      .title { font-size:43px; font-weight:700; }
      .sub { font-size:25px; fill:#496678; }
      .group { font-size:30px; font-weight:700; }
      .label { font-size:27px; font-weight:700; }
      .body { font-size:24px; }
      .tiny { font-size:21px; fill:#496678; }
      .card { fill:#fff; stroke:#c8d9e3; stroke-width:2; }
      .line { stroke:#547286; stroke-width:3; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="#f5f9fb"/>
  <text x="54" y="72" class="title">GQA：8 个 Q 头，复用 2 组 K/V</text>
  <text x="56" y="114" class="sub">E4B 第 0 层局部 Attention · 下标表示头编号；每个 K/V 头含可见位置上的一串 K/V</text>

  <rect x="50" y="152" width="1500" height="219" rx="22" class="card"/>
  <rect x="50" y="152" width="13" height="219" rx="7" fill="#338eb9"/>
  <text x="82" y="200" class="group">第 1 组</text>
  <text x="82" y="240" class="tiny">4 个独立查询</text>
  <g fill="#e4f3fa" stroke="#86bdd5" stroke-width="2">
    <rect x="280" y="211" width="112" height="68" rx="13"/><rect x="405" y="211" width="112" height="68" rx="13"/>
    <rect x="530" y="211" width="112" height="68" rx="13"/><rect x="655" y="211" width="112" height="68" rx="13"/>
  </g>
  <text x="315" y="254" class="label">Q₀</text><text x="440" y="254" class="label">Q₁</text>
  <text x="565" y="254" class="label">Q₂</text><text x="690" y="254" class="label">Q₃</text>
  <path d="M779 245 H825" class="line"/>
  <rect x="840" y="192" width="286" height="108" rx="17" fill="#eaf3ec" stroke="#83b493" stroke-width="2"/>
  <text x="877" y="237" class="label">共用 K₀ / V₀</text>
  <text x="873" y="273" class="tiny">同一组历史键和值</text>
  <path d="M1137 245 H1177" class="line"/>
  <text x="1197" y="230" class="label">各算一行权重</text>
  <text x="1197" y="270" class="body">各得一份头输出</text>
  <text x="280" y="335" class="tiny">Q₀～Q₃ 分别匹配 K₀，并用各自权重读取 V₀；共享数据，不共享注意力结果。</text>

  <rect x="50" y="393" width="1500" height="219" rx="22" class="card"/>
  <rect x="50" y="393" width="13" height="219" rx="7" fill="#806cb4"/>
  <text x="82" y="441" class="group">第 2 组</text>
  <text x="82" y="481" class="tiny">4 个独立查询</text>
  <g fill="#efeaf8" stroke="#b6a6d5" stroke-width="2">
    <rect x="280" y="452" width="112" height="68" rx="13"/><rect x="405" y="452" width="112" height="68" rx="13"/>
    <rect x="530" y="452" width="112" height="68" rx="13"/><rect x="655" y="452" width="112" height="68" rx="13"/>
  </g>
  <text x="315" y="495" class="label">Q₄</text><text x="440" y="495" class="label">Q₅</text>
  <text x="565" y="495" class="label">Q₆</text><text x="690" y="495" class="label">Q₇</text>
  <path d="M779 486 H825" class="line"/>
  <rect x="840" y="433" width="286" height="108" rx="17" fill="#eaf3ec" stroke="#83b493" stroke-width="2"/>
  <text x="877" y="478" class="label">共用 K₁ / V₁</text>
  <text x="873" y="514" class="tiny">另一组历史键和值</text>
  <path d="M1137 486 H1177" class="line"/>
  <text x="1197" y="471" class="label">各算一行权重</text>
  <text x="1197" y="511" class="body">各得一份头输出</text>
  <text x="280" y="576" class="tiny">Q₄～Q₇ 分别匹配 K₁，并用各自权重读取 V₁；两个分组的 K/V 不混用。</text>

  <rect x="50" y="642" width="1500" height="78" rx="18" fill="#dfeef5"/>
  <text x="79" y="691" class="label">结果：K/V 只有 2 组；8 个 Q 头仍各自完成匹配、加权汇聚，最后合并。</text>
</svg>
